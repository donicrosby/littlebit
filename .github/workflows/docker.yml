name: images

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install app deps (same frozen pins the images use)
        run: pip install -r ci/requirements-cuda.txt
      - name: P0 hermetic suite (CPU-only)
        run: python tests/run_p0.py

  image:
    needs: p0
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            reqs: ci/requirements-cuda.txt
          - variant: runpod
            base: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
            reqs: ci/requirements-cuda.txt
          - variant: rocm
            base: ubuntu:24.04
            reqs: ci/requirements-rocm.txt
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            REQUIREMENTS_FILE=${{ matrix.reqs }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
