name: images

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export app requirements from the lock (torch excluded)
        run: uv export --extra cuda --no-hashes --no-emit-project | grep -vE '^(torch|triton|nvidia-)' > /tmp/reqs-ci.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install app deps (lock pins, CPU torch from above)
        run: pip install -r /tmp/reqs-ci.txt
      - name: P0 hermetic suite (CPU-only)
        run: python tests/run_p0.py

  # Run the BUILT artifact before anything is pushed — the gate that was
  # missing when a broken image shipped green (p0 tested the pristine
  # checkout, never the container). Hosted runners are 4 vCPU / 16GB and
  # OOM-kill (SIGKILL) if we load a real 0.6B model twice + optimizer
  # state, so the in-image gate is MODE=p0: fully synthetic, hermetic,
  # minutes-fast — and it exercises exactly the class of bug that shipped:
  # entrypoint present, layout sane, package imports, core math, save/load.
  # Real-model smoke (MODE=smoke) runs on GPUs — RunPod or a self-hosted
  # runner on the lab box — not on free GitHub runners.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            extra: cuda
          - variant: runpod
            base: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
            extra: cuda
          - variant: rocm
            base: ubuntu:24.04
            extra: rocm
            keep_torch: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate variant requirements from uv.lock
        run: |
          mkdir -p build
          if [ "${{ matrix.keep_torch }}" = "true" ]; then
            { echo "--extra-index-url https://pypi.org/simple/"
              echo "--extra-index-url https://stable.repo.amd.com/rocm/whl-next/"
              uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project
            } > build/requirements.txt
          else
            uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project \
              | grep -vE '^(torch|torchvision|triton|nvidia-)' > build/requirements.txt
          fi
          wc -l build/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally (shared cache with the push job)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          push: false
          load: true
          tags: littlebit-ci:${{ matrix.variant }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            REQUIREMENTS_FILE=build/requirements.txt
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
      - name: Run the built image — MODE=p0 (hermetic, runner-sized)
        run: docker run --rm -e MODE=p0 littlebit-ci:${{ matrix.variant }}

  image:
    needs: [p0, artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base images provide the torch runtime; we layer only the app delta.
          - variant: cuda
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            extra: cuda
            keep_torch: false
          - variant: runpod
            base: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
            extra: cuda
            keep_torch: false
          # ROCm base has no torch; the lock's AMD-index pins install it.
          - variant: rocm
            base: ubuntu:24.04
            extra: rocm
            keep_torch: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate variant requirements from uv.lock
        run: |
          mkdir -p build
          if [ "${{ matrix.keep_torch }}" = "true" ]; then
            { echo "--extra-index-url https://pypi.org/simple/"
              echo "--extra-index-url https://stable.repo.amd.com/rocm/whl-next/"
              uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project
            } > build/requirements.txt
          else
            uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project \
              | grep -vE '^(torch|torchvision|triton|nvidia-)' > build/requirements.txt
          fi
          wc -l build/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.variant }}
            type=raw,value=latest-${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}-${{ matrix.variant }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            REQUIREMENTS_FILE=build/requirements.txt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
