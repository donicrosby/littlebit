name: images

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Publish gate: only push events to master/main or v* tags publish images.
  # PRs build + test only. (YAML anchors are unsupported in Actions — this is
  # restated in each gated step's `if`.)

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export app requirements from the lock (torch excluded)
        run: uv export --extra cuda --no-hashes --no-emit-project | grep -vE '^(torch|triton|nvidia-)' > /tmp/reqs-ci.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install app deps (lock pins, CPU torch from above)
        run: pip install -r /tmp/reqs-ci.txt
      - name: P0 hermetic suite (CPU-only)
        run: python tests/run_p0.py

  # ONE build per variant. Build, load into the runner's docker daemon, run
  # the in-image gate (MODE=p0), then push THOSE EXACT BYTES under a
  # ci-<sha>-<variant> tag. The image job then re-tags server-side — blobs
  # never move, nothing is ever rebuilt, and what ships is what was tested.
  # (The previous design built twice: artifact tested a throwaway image while
  # image job rebuilt from scratch for the push — gha cache never produced
  # layer hits because requirements.txt/base-tag inputs changed, and the
  # published bytes were never the tested bytes.)
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            extra: cuda
          - variant: runpod
            base: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
            extra: cuda
          - variant: rocm
            base: ubuntu:24.04
            extra: rocm
            keep_torch: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate variant requirements from uv.lock
        run: |
          mkdir -p build
          if [ "${{ matrix.keep_torch }}" = "true" ]; then
            { echo "--extra-index-url https://pypi.org/simple/"
              echo "--extra-index-url https://stable.repo.amd.com/rocm/whl-next/"
              uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project
            } > build/requirements.txt
          else
            uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project \
              | grep -vE '^(torch|torchvision|triton|nvidia-)' > build/requirements.txt
          fi
          wc -l build/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally (single build for test + publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.variant }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            REQUIREMENTS_FILE=build/requirements.txt
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
      - name: Run the built image — MODE=p0 (hermetic, runner-sized)
        run: docker run --rm -e MODE=p0 ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.variant }}
      - name: Log in to ghcr (publish events only)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested bytes as ci- tag
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: docker push ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.variant }}

  # No rebuild here — server-side re-tag of the tested image. Blobs stay in
  # ghcr storage; this takes seconds and guarantees published == tested.
  image:
    needs: [p0, artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
          - variant: runpod
          - variant: rocm
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr (publish events only)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag tested image for publish (latest-<variant>, sha-<sha>-<variant>)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          SRC="ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.variant }}"
          docker buildx imagetools create \
            -t "ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.variant }}" \
            -t "ghcr.io/${{ env.IMAGE_NAME }}:latest-${{ matrix.variant }}" \
            "$SRC"
          docker buildx imagetools inspect "ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.variant }}"
      - name: PR path — verify tested ci- tag exists (no publish on PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker pull "ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.variant }}" \
            && echo "ci tag present (unexpected on PR — push should be gated)" \
            || echo "no ci tag on PR (expected — build tested locally only)"
