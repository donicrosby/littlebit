name: images

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export app requirements from the lock (torch excluded)
        run: uv export --extra cuda --no-hashes --no-emit-project | grep -vE '^(torch|triton|nvidia-)' > /tmp/reqs-ci.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install app deps (lock pins, CPU torch from above)
        run: pip install -r /tmp/reqs-ci.txt
      - name: P0 hermetic suite (CPU-only)
        run: python tests/run_p0.py

  # Run the BUILT image end-to-end before anything is pushed. This is the
  # gate that was missing: p0 exercises the pristine checkout, not the
  # artifact — a container that ships a broken path layout passed CI while
  # crashing in 10s at runtime. Smoke builds the same Dockerfile locally
  # (shared GHA layer cache, so it's cheap) and runs MODE=smoke on CPU.
  # No GPU on hosted runners, so params are trimmed; the gates still cover
  # imports, path resolution, token cache, QAT, save/load fidelity, BPW.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            extra: cuda
          - variant: runpod
            base: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
            extra: cuda
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate variant requirements from uv.lock
        run: |
          mkdir -p build
          uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project \
            | grep -vE '^(torch|torchvision|triton|nvidia-)' > build/requirements.txt
          wc -l build/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally (shared cache with the push job)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          push: false
          load: true
          tags: littlebit-ci:${{ matrix.variant }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            REQUIREMENTS_FILE=build/requirements.txt
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
      - name: Run the built image (CPU, hermetic)
        env:
          SMOKE_STEPS: '40'
          SMOKE_EVAL_SEQS: '24'
        run: |
          docker run --rm \
            -e MODE=smoke -e SMOKE_STEPS -e SMOKE_EVAL_SEQS \
            -v "$PWD/smoke-out:/workspace/out" \
            littlebit-ci:${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ matrix.variant }}
          path: smoke-out/

  image:
    needs: [p0, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base images provide the torch runtime; we layer only the app delta.
          - variant: cuda
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
            extra: cuda
            keep_torch: false
          - variant: runpod
            base: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
            extra: cuda
            keep_torch: false
          # ROCm base has no torch; the lock's AMD-index pins install it.
          - variant: rocm
            base: ubuntu:24.04
            extra: rocm
            keep_torch: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate variant requirements from uv.lock
        run: |
          mkdir -p build
          if [ "${{ matrix.keep_torch }}" = "true" ]; then
            { echo "--extra-index-url https://pypi.org/simple/"
              echo "--extra-index-url https://stable.repo.amd.com/rocm/whl-next/"
              uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project
            } > build/requirements.txt
          else
            uv export --extra ${{ matrix.extra }} --no-hashes --no-emit-project \
              | grep -vE '^(torch|torchvision|triton|nvidia-)' > build/requirements.txt
          fi
          wc -l build/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.variant }}
            type=raw,value=latest-${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}-${{ matrix.variant }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            REQUIREMENTS_FILE=build/requirements.txt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
